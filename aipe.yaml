schema_version: 0.1.0
# Stable registry identifier. The product was renamed to AIPE Sketcher in
# 0.2.0; the id and the Engineering State namespace stay `aipe.sketch`.
id: aipe.sketch
name: AIPE Sketcher
type: tool
domains: [power-electronics, circuit-documentation]
description: AI-powered electrical schematic generation for power electronics and circuit engineering. Renders explicit Circuit IR into connectivity-checked SVG schematics with validation reports and provenance; installable as a Codex and Claude Code plugin.
status: active
maturity: usable
repository: https://github.com/FulongLi/AIPE-Sketcher
license: LicenseRef-AIPE-Sketcher-Personal-NonCommercial-0.1 AND CC0-1.0
capabilities: [schematic-generation, circuit-connectivity-validation]
inputs:
  - {name: circuit-ir, description: Explicit versioned Netlist electrical graph (Circuit IR JSON version 1).}
  - {name: engineering-state, description: Core state with an explicit aipe.sketch circuit extension., schema: 'https://raw.githubusercontent.com/FulongLi/AIPE-Core/v0.1.0/schemas/engineering-state.schema.json'}
outputs:
  - {name: schematic-svg, description: SVG with unchanged electrical connectivity.}
  - {name: validation-report, description: 'JSON report of electrical validation, drawing connectivity and layout quality.'}
  - {name: provenance, description: Hash-linked artifact and source-state metadata.}
dependencies:
  - {id: aipe.core, version: 0.1.x, optional: true}
compatibility: {core: 0.1.x, engineering_state: 0.1.x, integration: mapped}
tools:
  - {id: python, name: Python, capabilities: [schematic-generation, circuit-connectivity-validation], licence_class: open_source, optional: false, interfaces: [python, cli], platforms: [linux, windows, macos], url: 'https://www.python.org/', limitations: ['Python 3.9 or newer; standard library only.', 'Drawing connectivity validation is not physical validation.']}
  - {id: inkscape, name: Inkscape, capabilities: [svg-editing], licence_class: open_source, optional: true, interfaces: [cli, gui], platforms: [linux, windows, macos], url: 'https://inkscape.org/', limitations: ['Manual editing may invalidate original connectivity and artifact hashes.']}
  - {id: codex-cli, name: OpenAI Codex, capabilities: [schematic-generation], licence_class: open_source, optional: true, interfaces: [cli, gui], platforms: [linux, windows, macos], url: 'https://github.com/openai/codex', limitations: ['Agent host only; requires a user account for the model service. All drawing and validation run in the local Python engine.']}
  - {id: claude-code, name: Claude Code, capabilities: [schematic-generation], licence_class: free_proprietary, optional: true, interfaces: [cli, gui], platforms: [linux, windows, macos], url: 'https://code.claude.com/', limitations: ['Agent host only; requires a user account for the model service. All drawing and validation run in the local Python engine.']}
connectors: []
validation:
  status: tested
  evidence:
    - tests/test_state.py
    - tests/test_pipeline.py
    - tests/test_cli.py
    - tests/test_plugin_packaging.py
  limitations: [Explicit Circuit IR and complete Core validation are required separately; no device sizing or physical results are inferred.]
documentation:
  - README.md
  - docs/README.md
  - docs/plugins.md
  - docs/cli.md
  - docs/engineering-state.md
  - docs/architecture.md
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extensions:
  aipe.sketch:
    package: aipe-sketcher 0.2.0
    python_package: aipe_sketch
    python: ">=3.9"
    runtime_requirements: {required: [], optional: {}}
    interfaces:
      python_api: aipe_sketch.Schematic.from_netlist
      cli: aipe-sketcher
      plugins: {codex: plugin.json, claude_code: .claude-plugin/plugin.json, skill: skills/schematic/SKILL.md}
    identifiers:
      registry_id: aipe.sketch
      engineering_state_extension: aipe.sketch
      provenance_tool_id: aipe.sketch
      plugin_name: aipe-sketcher
      notes: Product renamed from AIPE Sketch to AIPE Sketcher in 0.2.0; machine identifiers are unchanged, so no state migration is needed.
    standalone_operation: {requires_aipe_core: false, requires_registry_service: false, requires_other_domain_experts: false, requires_commercial_software: false, requires_llm_credentials: false, requires_network: false}
    optional_integrations:
      - {id: aipe.core, kind: engineering-state-input, status: tested-offline, notes: Reads extensions.aipe.sketch.circuit_ir from Engineering State 0.1.0; full state validation remains AIPE-Core's responsibility.}
    third_party:
      - {name: UPB-LEA Inkscape electric symbols, files: assets/master/Inkscape_Symbols_All.svg, license: CC0-1.0, url: 'https://github.com/upb-lea/Inkscape_electric_Symbols'}
